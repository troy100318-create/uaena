<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UAENA - 주변 핫플 추천</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="uaena.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">U</div>
          <div>
            <p class="eyebrow">UAENA</p>
            <h1>내 주변 핫플</h1>
          </div>
        </div>
        <button id="refreshBtn" class="ghost-btn">위치 새로고침</button>
      </header>

      <button id="feedbackBtn" class="feedback-fab" type="button" aria-label="불편한 점 건의하기">
        건의함
      </button>

      <main class="content">
        <section class="hero">
          <div class="hero-copy">
            <span class="pill">평점 4.0 이상</span>
            <div class="partner-row" aria-label="플랫폼 연동">
              <span class="partner-pill">네이버</span>
              <span class="partner-pill">카카오</span>
              <span class="partner-pill">구글</span>
            </div>
            <h2>지금 내 주변에서<br />인기 있는 장소를 추천해드릴게요.</h2>
            <p>
              네이버·카카오·구글 리뷰를 종합해 실제 체류 만족도가 높은 핫플만
              골라서 보여드립니다.
            </p>
            <div class="location-box">
              <span class="dot"></span>
              <div>
                <label>현재 위치</label>
                <strong id="locationText">위치 확인 중...</strong>
              </div>
            </div>
          </div>

          <div class="hero-visual" aria-label="추천 요약 카드">
            <div class="stat-card primary">
              <span>추천 매장</span>
              <strong id="resultsCount">0곳</strong>
            </div>
            <div class="stat-card secondary">
              <span>평균 평점</span>
              <strong id="avgRating">0.0</strong>
            </div>
            <div class="map-glow">
              <div class="pin pin-one"></div>
              <div class="pin pin-two"></div>
              <div class="pin pin-three"></div>
            </div>
          </div>
        </section>

        <section class="filters">
          <div class="filter-chip active">추천순</div>
          <div class="filter-chip">거리순</div>
          <div class="filter-chip">평점순</div>
        </section>

        <section class="list-section">
          <div class="section-header">
            <h3>플랫폼 평점 4.0 이상 추천</h3>
            <span id="statusBadge" class="status-badge">위치 탐색 중</span>
          </div>
          <ul id="placeList" class="place-list"></ul>
        </section>
      </main>
    </div>

    <div id="feedbackModal" class="feedback-modal hidden" aria-hidden="true">
      <div class="feedback-panel" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle">
        <button id="closeFeedbackModal" class="close-btn" type="button" aria-label="닫기">×</button>

        <div class="feedback-header">
          <p class="eyebrow small">UAENA</p>
          <h3 id="feedbackTitle">불편한 점 건의하기</h3>
        </div>

        <form id="feedbackForm" action="https://formspree.io/f/xeaoznyv" method="POST">
          <input type="hidden" name="_subject" value="UAENA 불편사항 건의" />
          <input type="hidden" name="_captcha" value="false" />

          <div class="field-group">
            <label for="feedbackName">이름</label>
            <input id="feedbackName" name="name" type="text" placeholder="홍길동" />
          </div>

          <div class="field-group">
            <label for="feedbackEmail">이메일</label>
            <input id="feedbackEmail" name="email" type="email" placeholder="example@email.com" />
          </div>

          <div class="field-group">
            <label for="feedbackType">건의 유형</label>
            <select id="feedbackType" name="category">
              <option value="서비스 불편">서비스 불편</option>
              <option value="잘못된 추천">잘못된 추천</option>
              <option value="위치 관련">위치 관련</option>
              <option value="UI/UX 개선">UI/UX 개선</option>
              <option value="기타">기타</option>
            </select>
          </div>

          <div class="field-group">
            <label for="feedbackMessage">상세 내용</label>
            <textarea
              id="feedbackMessage"
              name="message"
              rows="5"
              placeholder="불편했던 점이나 개선하고 싶은 내용을 자세히 적어주세요."
              required
            ></textarea>
          </div>

          <button class="submit-btn" type="submit">건의사항 보내기</button>
          <p id="formStatus" class="form-status" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <script src="uaena.js"></script>
  </body>
</html>
